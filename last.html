<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You</title>

    <style>

        :root {
            --color-light-sand: #D1B27B;
            --color-warm-tan: #B88655;
            --color-amber: #B3682D;
            --color-rust: #9D3E13;
            --color-deep-brown: #6C3B1A;

            --color-text-main: #3A1F0F;
            --color-text-soft: #F3E1B7;
            --color-decoration: #D1B27B;
            --color-decoration-glow: rgba(209, 178, 123, 0.32);
            --color-white: #e6d5c3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family: Georgia, 'Times New Roman', serif;
            color: var(--color-text-main);
        }


        /* =========================
           BACKGROUND / PAGE
        ========================== */

        .page {
            position: relative;

            min-height: 100vh;
            width: 100%;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(243, 225, 183, 0.08),
                    rgba(58, 31, 15, 0.05)
                ),
                url("wallpaper.png");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* =========================
           CONTENT
        ========================== */

        .content {
            position: relative;
            z-index: 2;

            width: min(650px, 90%);

            margin-top: 9vw;
            margin-left: 7vw;

            padding: 45px;

            text-align: center;
        }


        .subtitle {
            display: inline-block;

            margin-bottom: 18px;

            font-family: 'Trebuchet MS', sans-serif;
            font-size: 15px;

            letter-spacing: 5px;
            text-transform: uppercase;

            color: var(--color-rust);

            opacity: 0;

            animation: fadeUp 1.2s ease forwards;
        }


        .title {
            font-size: clamp(45px, 7vw, 82px);

            font-weight: normal;
            line-height: 1;

            color: var(--color-text-main);

            text-shadow:
                0 2px 0 rgba(243, 225, 183, 0.35);

            opacity: 0;

            animation:
                fadeUp 1.2s ease 0.2s forwards;
        }


        .title span {
            color: var(--color-rust);
        }


        .line {
            width: 0;
            height: 1px;

            margin: 25px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--color-rust),
                    transparent
                );

            animation:
                lineGrow 1.2s ease 0.8s forwards;
        }


        .description {
            max-width: 500px;

            margin: 0 auto;

            font-size: 19px;
            line-height: 1.9;

            color: var(--color-deep-brown);

            opacity: 0;

            animation:
                fadeUp 1.2s ease 0.9s forwards;
        }


        /* =========================
           HEART
        ========================== */

        .heart-wrapper {
            position: relative;

            width: 110px;
            height: 110px;

            margin: 35px auto;
        }


        .heart {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 52px;
            height: 52px;

            background: var(--color-rust);

            transform:
                translate(-50%, -50%)
                rotate(-45deg);

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(157, 62, 19, 0.35)
                );

            animation:
                heartbeat 1.45s infinite ease-in-out;
        }


        .heart::before,
        .heart::after {
            content: "";

            position: absolute;

            width: 52px;
            height: 52px;

            background: var(--color-rust);

            border-radius: 50%;
        }


        .heart::before {
            top: -26px;
            left: 0;
        }


        .heart::after {
            top: 0;
            left: 26px;
        }


        .heart-wrapper::before {
            content: "";

            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            border-radius: 50%;

            border:
                1px solid
                rgba(157, 62, 19, 0.25);

            animation:
                pulseRing 1.45s infinite;
        }


        /* =========================
           BUTTON
        ========================== */

        .button {
            display: inline-block;

            padding: 13px 30px;

            border:
                1px solid
                var(--color-rust);

            color: var(--color-rust);

            background:
                rgba(243, 225, 183, 0.35);

            text-decoration: none;

            font-family:
                'Trebuchet MS',
                sans-serif;

            font-size: 15px;

            letter-spacing: 2px;

            transition:
                0.35s ease;

            opacity: 0;

            animation:
                fadeUp 1.2s ease 1.2s forwards;
        }


        .button:hover {
            color: var(--color-white);

            background:
                var(--color-rust);

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 25px
                rgba(108, 59, 26, 0.25);
        }


        /* =========================
           PARTICLES
        ========================== */

        .particle {
            position: absolute;

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background:
                var(--color-rust);

            opacity: 0;

            pointer-events: none;

            animation:
                float 6s infinite ease-in-out;
        }


        .particle:nth-child(1) {
            left: 12%;
            top: 25%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 34%;
            top: 70%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(3) {
            left: 48%;
            top: 30%;
            animation-delay: 3s;
        }

        .particle:nth-child(4) {
            left: 20%;
            top: 82%;
            animation-delay: 4s;
        }

        .particle:nth-child(5) {
            left: 58%;
            top: 68%;
            animation-delay: 2s;
        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes heartbeat {

            0% {
                transform:
                    translate(-50%, -50%)
                    rotate(-45deg)
                    scale(1);
            }

            15% {
                transform:
                    translate(-50%, -50%)
                    rotate(-45deg)
                    scale(1.18);
            }

            30% {
                transform:
                    translate(-50%, -50%)
                    rotate(-45deg)
                    scale(1);
            }

            45% {
                transform:
                    translate(-50%, -50%)
                    rotate(-45deg)
                    scale(1.14);
            }

            60% {
                transform:
                    translate(-50%, -50%)
                    rotate(-45deg)
                    scale(1);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    rotate(-45deg)
                    scale(1);
            }
        }


        @keyframes pulseRing {

            0% {
                transform: scale(1);
                opacity: 0;
            }

            25% {
                opacity: 0.8;
            }

            100% {
                transform: scale(1.75);
                opacity: 0;
            }
        }


        @keyframes float {

            0% {
                transform:
                    translateY(20px)
                    scale(0.5);

                opacity: 0;
            }

            25% {
                opacity: 0.45;
            }

            50% {
                transform:
                    translateY(-35px)
                    scale(1);
            }

            75% {
                opacity: 0.25;
            }

            100% {
                transform:
                    translateY(-80px)
                    scale(0.4);

                opacity: 0;
            }
        }


        @keyframes fadeUp {

            from {
                opacity: 0;
                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }


        @keyframes lineGrow {

            from {
                width: 0;
            }

            to {
                width: 170px;
            }
        }


        /* =========================
           DESKTOP
        ========================== */

        @media (min-width: 701px) {

            .page {
                min-height: 100vh;

                /*
                Posisi wallpaper untuk laptop/PC
                */
                background-position:
                    center center;
            }
        }


        /* =========================
           HP / MOBILE
        ========================== */

        @media (max-width: 700px) {

            .page {
                min-height: 100svh;

                /*
                Cover membuat wallpaper
                memenuhi layar HP tanpa gepeng.
                */
                background-size: cover;

                /*
                Ubah posisi wallpaper khusus HP.
                Kamu bisa mencoba:
                50% center
                45% center
                40% center
                */
                background-position:
                    50% center;
            }


            .content {
                width: 100%;

                margin: 0;

                padding:
                    80px 25px 50px;

                text-align: center;
            }


            .subtitle {
                font-size: 11px;

                letter-spacing: 3px;

                margin-bottom: 15px;
            }


            .title {
                font-size: 48px;

                line-height: 1.05;
            }


            .description {
                max-width: 100%;

                padding: 0 5px;

                font-size: 15px;

                line-height: 1.75;
            }


            .heart-wrapper {
                width: 100px;
                height: 100px;

                margin: 30px auto;
            }


            .button {
                padding: 12px 22px;

                font-size: 13px;

                letter-spacing: 1.5px;
            }


            .particle {
                width: 7px;
                height: 7px;
            }
        }


        /* =========================
           HP SANGAT KECIL
        ========================== */

        @media (max-width: 400px) {

            .content {
                padding:
                    65px 18px 40px;
            }


            .title {
                font-size: 42px;
            }


            .description {
                font-size: 14px;

                line-height: 1.7;
            }
        }

    </style>
</head>


<body>

    <main class="page">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>


        <section class="content">

            <p class="subtitle">
                one more thing to tell you
            </p>


            <h1 class="title">
                Happy <span>Birthday</span>
            </h1>


            <div class="line"></div>


            <p class="description">
                For the person who became one of the most beautiful
                parts of my life, may your life be as beautiful as
                the way you make mine feel. And may this new year
                of your life be written in moments you will never forget.
            </p>


            <div class="heart-wrapper">
                <div class="heart"></div>
            </div>


            <a href="#" class="button">
                You are my everything
            </a>

        </section>

    </main>

</body>
</html>
